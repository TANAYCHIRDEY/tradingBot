# docker-compose.yml
# Skeleton — services will be configured in Phase 25 (Dockerization).
# Listed here to define the target architecture.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-algotrading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # backend:
  #   build: ./backend
  #   depends_on: [postgres, redis]

  # celery-worker:
  #   build: ./backend
  #   command: celery -A app.workers.celery_app worker
  #   depends_on: [postgres, redis]

  # frontend:
  #   build: ./frontend
  #   depends_on: [backend]

volumes:
  postgres_data:
